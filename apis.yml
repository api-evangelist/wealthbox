    name: Wealthbox CRM API
    description: >-
      REST API for managing contacts, tasks, events, opportunities, projects,
      notes, workflows, custom fields, teams, and activity streams in
      Wealthbox CRM. Supports personal Access Tokens (ACCESS_TOKEN header) or
      OAuth 2.0 authorization code flow.
    humanURL: https://dev.wealthbox.com

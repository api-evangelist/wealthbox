aid: wealthbox
name: Wealthbox
description: >-
  Wealthbox is a CRM platform built specifically for financial advisors,
  offering contact management, task workflows, opportunities, projects, and
  collaborative team features tailored to wealth management practices. The
  platform's REST API supports both personal Access Tokens and OAuth 2.0 for
  integrations, exposing CRUD endpoints for contacts, tasks, events, notes,
  workflows, custom fields, and activity streams under the api.crmworkspace.com
  base URL.
